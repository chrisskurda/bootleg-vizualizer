<!doctype html><meta charset="utf-8"><title>Cover Ambient</title>
<script src="../../core/pack-runtime.js"></script>
<script>
definePack({
  bg:'#000',
  draw(ctx,T,A,P,K){
    const W=1920,H=1080,TAU=K.TAU,cov=K.coverArt(A);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);if(!cov){K.text(ctx,'No cover',960,540,{align:'center',font:'500 32px system-ui',alpha:.5});return}
    const ph=K.phase(T,24,1)*TAU,C=cov.colors,s=1+.06*Math.sin(ph);
    ctx.save();ctx.translate(W/2,H/2);ctx.scale(s,s);ctx.translate(-W/2,-H/2);K.coverBlur(ctx,cov,-60,-60,W+120,H+120,24);ctx.restore();
    ctx.fillStyle='rgba(0,0,0,'+P.dim+')';ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    const gx=540+Math.sin(ph)*30,g=ctx.createRadialGradient(gx,540,100,gx,540,620);g.addColorStop(0,K.rgba(C[0],.22+A.bass*.25));g.addColorStop(1,K.rgba(C[0],0));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='source-over';
    const z=1+(A.beat*.025+A.bass*.02)*P.pulse,S=560*z,x=530-S/2,y=540-S/2;
    K.softShadow(ctx,x,y,S,S,18,{blur:60,dy:30,alpha:.6});
    ctx.save();ctx.beginPath();ctx.roundRect(x,y,S,S,18);ctx.clip();K.coverDraw(ctx,cov,0,0,1,1,x,y,S,S);
    const sh=ctx.createLinearGradient(x,y,x+S,y+S);sh.addColorStop(0,'rgba(255,255,255,.16)');sh.addColorStop(.4,'rgba(255,255,255,0)');ctx.fillStyle=sh;ctx.fillRect(x,y,S,S);ctx.restore();
    const m=A.meta||{};K.text(ctx,m.title||'Untitled',930,420,{font:'700 68px system-ui',maxW:850});K.text(ctx,m.artist||'',932,478,{font:'500 34px system-ui',alpha:.7,maxW:850});
    if(A.section)K.text(ctx,A.section.name.toUpperCase(),932,530,{font:'600 22px system-ui',alpha:.5});
    if(P.bars)for(let i=0;i<40;i++){const v=Math.min(1,A.spectrum[Math.floor(i*1.4)]*1.25),h=10+v*230,bx=932+i*20;ctx.fillStyle=K.rgba(C[Math.floor(i/8)%5],.9);ctx.beginPath();ctx.roundRect(bx,760-h,12,h,6);ctx.fill();}
  }
});
</script>
