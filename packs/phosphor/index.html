<!doctype html><meta charset="utf-8"><title>Phosphor</title>
<script src="../../core/pack-runtime.js"></script>
<script>
const avg = (a, i, j) => { let s = 0; for (let k = i; k < j; k++) s += a[k]; return s / (j - i); };
definePack({
  draw(ctx, T, A, P, K) {
    const W = 1920, H = 1080, cx = W / 2, cy = H / 2, x0 = 120, sw = 1680;
    ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H);
    if (P.grid) {
      ctx.strokeStyle = K.css(P.palette, .6, .1); ctx.lineWidth = 1; ctx.beginPath();
      for (let i = 0; i <= 14; i++) { const x = x0 + sw * i / 14; ctx.moveTo(x, 150); ctx.lineTo(x, H - 150); }
      for (let j = 0; j <= 6; j++) { const y = 150 + (H - 300) * j / 6; ctx.moveTo(x0, y); ctx.lineTo(x0 + sw, y); }
      ctx.stroke();
    }
    const cur = avg(A.spectrum, 0, 64) + .05, amp = 300;
    const line = (k, alpha, wid) => {
      const pa = k ? avg(A.past(k * .06), 0, 64) : cur, sc = Math.min(1.5, pa / cur), sh = k * 3, pts = [];
      for (let i = 0; i < 128; i += 2) pts.push([x0 + sw * i / 127 + k * 10, cy + k * 7 + A.wave[(i + sh) % 128] * amp * sc]);
      ctx.beginPath(); K.smooth(ctx, pts);
      ctx.strokeStyle = K.css(P.palette, .55 + .4 * (1 - k / 14), alpha); ctx.lineWidth = wid; ctx.stroke();
    };
    ctx.globalCompositeOperation = 'lighter'; ctx.lineJoin = 'round';
    for (let k = P.trails; k >= 1; k--) line(k, .5 * Math.pow(1 - k / (P.trails + 1), 2), 3);
    line(0, .22 + A.beat * .2, 16); line(0, 1, 3.5);
    ctx.globalCompositeOperation = 'source-over';
    K.text(ctx, A.meta.title, x0, 96, { font: '600 40px ui-monospace,monospace', color: K.css(P.palette, .9), maxW: 900, upper: true });
    K.text(ctx, A.section ? A.section.name : (A.live ? '' : 'NO SIGNAL'), x0, 132, { font: '400 24px ui-monospace,monospace', color: K.css(P.palette, .7), upper: true, alpha: .8 });
    K.text(ctx, K.fmtTime(A.t), x0 + sw, 96, { font: '400 32px ui-monospace,monospace', align: 'right', color: K.css(P.palette, .9) });
    for (let i = 0; i < 3; i++) {
      const v = [A.bass, A.mid, A.high][i], y = H - 100;
      ctx.fillStyle = K.css(P.palette, .3, .2); ctx.fillRect(x0 + i * 220, y, 180, 8);
      ctx.fillStyle = K.css(P.palette, .3 + i * .3); ctx.fillRect(x0 + i * 220, y, 180 * v, 8);
      K.text(ctx, ['LOW', 'MID', 'HIGH'][i], x0 + i * 220, y - 14, { font: '400 20px ui-monospace,monospace', alpha: .6, color: K.css(P.palette, .9) });
    }
  }
});
</script>
