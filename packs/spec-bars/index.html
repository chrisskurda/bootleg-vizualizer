<!doctype html><meta charset="utf-8"><title>Spectrum: Bars</title>
<script src="../../core/pack-runtime.js"></script>
<script>
definePack({

draw(ctx, T, A, P, K) {
  const W = 1920, H = 1080, n = 64, base = P.mirror ? 640 : 900, maxH = P.mirror ? 460 : 700;
  ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, base, 0, W / 2, base, 900); g.addColorStop(0, K.css(P.palette, 0.5, 0.06 + 0.28 * A.bass)); g.addColorStop(1, K.css(P.palette, 0.5, 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const gw = (W - 240) / n, bw = gw * 0.7, lift = 1 + 0.08 * A.beat;
  for (let i = 0; i < n; i++) {
    const s = A.spectrum[i], h = Math.max(8, Math.pow(s, 1.3) * maxH * lift), x = 120 + i * gw + (gw - bw) / 2, u = i / (n - 1), r = P.round * bw / 2;
    const gr = ctx.createLinearGradient(0, base - h, 0, base); gr.addColorStop(0, K.css(P.palette, u, 1)); gr.addColorStop(1, K.css(P.palette, u, 0.35));
    ctx.fillStyle = gr; ctx.beginPath(); ctx.roundRect(x, base - h, bw, h, r); ctx.fill();
    if (P.mirror) { const rf = ctx.createLinearGradient(0, base + 6, 0, base + 6 + h * 0.55); rf.addColorStop(0, K.css(P.palette, u, 0.28)); rf.addColorStop(1, K.css(P.palette, u, 0));
      ctx.fillStyle = rf; ctx.beginPath(); ctx.roundRect(x, base + 6, bw, h * 0.55, r); ctx.fill(); }
    if (P.peaks) { const pk = Math.pow(K.peak(A, i), 1.3) * maxH * lift; ctx.fillStyle = K.css(P.palette, u, 0.95); ctx.beginPath(); ctx.roundRect(x, base - pk - 14, bw, 6, 3); ctx.fill(); }
  }
}
});
</script>
