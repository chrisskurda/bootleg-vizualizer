<!doctype html><meta charset="utf-8"><title>Cover Mirror</title>
<script src="../../core/pack-runtime.js"></script>
<script>
definePack({
  bg:'#05060a',
  draw(ctx,T,A,P,K){
    const W=1920,H=1080,TAU=K.TAU,cov=K.coverArt(A);ctx.fillStyle='#05060a';ctx.fillRect(0,0,W,H);if(!cov){K.text(ctx,'No cover',960,540,{align:'center',font:'500 32px system-ui',alpha:.5});return}
    K.coverBlur(ctx,cov,0,0,W,H,24);ctx.fillStyle='rgba(4,5,8,.78)';ctx.fillRect(0,0,W,H);
    const N=+P.wedges,R=420,rot=K.phase(T,24,1)*TAU,sc=1.25+A.bass*.12*P.react+.08*Math.sin(K.phase(T,24,2)*TAU),S=900;
    ctx.save();ctx.translate(W/2,H/2);
    for(let k=0;k<2*N;k++){
      ctx.save();ctx.rotate(k*Math.PI/N);if(k&1)ctx.scale(1,-1);
      ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,0,Math.PI/N);ctx.closePath();ctx.clip();
      ctx.translate(Math.cos(rot)*100,Math.sin(rot)*100);ctx.rotate(rot*2);ctx.scale(sc,sc);K.coverDraw(ctx,cov,0,0,1,1,-S/2,-S/2,S,S);ctx.restore();
    }
    ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,R,0,TAU);ctx.stroke();
    ctx.fillStyle=K.rgba(cov.colors[0],.9);ctx.beginPath();ctx.arc(0,0,10+A.beat*10,0,TAU);ctx.fill();
    if(P.ring){ctx.lineCap='round';ctx.lineWidth=8;for(let i=0;i<96;i++){const id=i<48?i:95-i,v=Math.min(1,A.spectrum[id]*1.3),a=i/96*TAU-Math.PI/2,r0=R+22,r1=r0+6+v*85;ctx.strokeStyle=K.rgba(cov.colors[Math.floor(id/10)%5],.9);ctx.beginPath();ctx.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);ctx.lineTo(Math.cos(a)*r1,Math.sin(a)*r1);ctx.stroke();}}
    ctx.restore();
  }
});
</script>
