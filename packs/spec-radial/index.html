<!doctype html><meta charset="utf-8"><title>Spectrum: Radial</title>
<script src="../../core/pack-runtime.js"></script>
<script>
definePack({

draw(ctx, T, A, P, K) {
  const W = 1920, H = 1080, cx = W / 2, cy = H / 2, TAU = K.TAU, R = 250 * (1 + 0.1 * A.bass + 0.05 * A.beat), rot = TAU * P.spin * T / 60;
  ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(cx, cy, R * 0.3, cx, cy, 760); g.addColorStop(0, K.css(P.palette, 0.45, 0.1 + 0.4 * A.bass)); g.addColorStop(1, K.css(P.palette, 0.45, 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.lineCap = 'round'; ctx.lineWidth = P.thick; ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 128; i++) {
    const idx = i < 64 ? i : 127 - i, s = A.spectrum[idx], a = rot + i / 128 * TAU, len = 12 + Math.pow(s, 1.2) * 310;
    ctx.strokeStyle = K.css(P.palette, idx / 63, 0.35 + 0.65 * s); ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); ctx.lineTo(cx + Math.cos(a) * (R + len), cy + Math.sin(a) * (R + len)); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = K.css(P.palette, 0.9, 0.5); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, R - 10, 0, TAU); ctx.stroke();
  if (P.showText) { // song info from metadata: cover art (if tagged) in the center, text under the ring
    const m = A.meta || {}, img = K.cover(A);
    if (img) { ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R * 0.52, 0, TAU); ctx.clip(); const z = Math.max(R * 1.04 / img.width, R * 1.04 / img.height); ctx.drawImage(img, cx - img.width * z / 2, cy - img.height * z / 2, img.width * z, img.height * z); ctx.restore(); }
    K.text(ctx, m.title, cx, H - 92, { font: '700 40px system-ui, sans-serif', color: '#fff', align: 'center', maxW: 1200 });
    K.text(ctx, [m.artist, m.album, m.year].filter(Boolean).join('  ·  '), cx, H - 52, { font: '400 24px system-ui, sans-serif', color: '#fff', align: 'center', alpha: 0.7, maxW: 1200 });
    K.text(ctx, [A.section && A.section.name, m.bpm && Math.round(m.bpm) + ' BPM', m.key].filter(Boolean).join('  ·  ').toUpperCase(), cx, 56, { font: '500 22px ui-monospace, monospace', color: '#fff', align: 'center', alpha: 0.6 });
  }
  const pts = []; for (let j = 0; j < 128; j += 2) { const a = j / 128 * TAU, r = R * 0.74 + A.wave[j] * 46; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  pts.push(pts[0], pts[1]); ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 3; ctx.beginPath(); K.smooth(ctx, pts); ctx.stroke();
}
});
</script>
