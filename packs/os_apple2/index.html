<!doctype html><meta charset="utf-8"><title>Apple II</title>
<script src="../../core/pack-runtime.js"></script>
<script>
const W=1920,H=1080,hh=n=>{const x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x)};
definePack({
  bg:'#000',
  draw(ctx,T,A,P,K){
    const mode=P.mode,clock=A.live?A.t:T,mono=mode!=='color',tint=mode==='amber'?'#ffb000':'#33ff33',cw=48,ch=22.5,lo=['#14f53c','#d0dd8d','#ff6a3c','#ffa0d0'];
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    for(let i=0;i<40;i++){
      const b=Math.min(63,1+Math.round(i*1.5)),v=Math.min(1,A.spectrum[b]*1.2),n=Math.round(v*38),pk=Math.round(Math.min(1,K.peak(A,b,1,.5))*38);
      for(let k=0;k<n;k++){const f=k/38;ctx.fillStyle=mono?tint:(f<.5?lo[0]:f<.75?lo[1]:f<.9?lo[2]:lo[3]);ctx.globalAlpha=mono?(k%2?.8:1):1;ctx.fillRect(i*cw+1,(39-k)*ch+.5,cw-2,ch-1);}
      ctx.globalAlpha=1;if(pk>n){ctx.fillStyle=mono?tint:'#fff';ctx.fillRect(i*cw+1,(39-pk)*ch+.5,cw-2,ch-1);}
    }
    const tcol=mono?tint:'#fff';
    const tx=(c,r,s,inv)=>{ctx.save();ctx.scale(2,1);ctx.font='700 38px "Courier New",monospace';ctx.textAlign='center';for(let i=0;i<s.length;i++){const y=900+r*45;if(inv){ctx.fillStyle=tcol;ctx.fillRect((c+i)*24,y,24,45);}ctx.fillStyle=inv?'#000':tcol;ctx.fillText(s[i],(c+i)*24+12,y+34);}ctx.restore();};
    tx(0,0,']RUN VIZ.MUSIC');tx(0,1,'NOW PLAYING: '+(A.meta.title||'UNTITLED').toUpperCase().slice(0,26));
    tx(0,2,'SECTION: '+((A.section&&A.section.name)||'-').toUpperCase().slice(0,14)+'  '+K.fmtTime(clock));
    tx(0,3,']');if(Math.floor(T*2)%2===0)tx(1,3,' ',true);
    if(P.scan){ctx.fillStyle='rgba(0,0,0,.28)';for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,1.6);}
  }
});
</script>
