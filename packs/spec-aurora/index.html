<!doctype html><meta charset="utf-8"><title>Spectrum: Aurora</title>
<script src="../../core/pack-runtime.js"></script>
<script>
definePack({

draw(ctx, T, A, P, K) {
  const W = 1920, H = 1080, cy = H / 2, maxH = 400, n = 64;
  ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  for (let L = P.layers - 1; L >= 0; L--) {
    const sp = A.past(L * P.trail), top = [], bot = [];
    for (let i = 0; i < n; i++) { const s = (sp[Math.max(0, i - 1)] + sp[i] * 2 + sp[Math.min(n - 1, i + 1)]) / 4, h = Math.pow(s, 1.15) * maxH * (1 - 0.1 * L), x = 70 + i * (W - 140) / (n - 1); top.push([x, cy - h]); bot.push([x, cy + h]); }
    const gr = ctx.createLinearGradient(0, 0, W, 0); for (let k = 0; k <= 4; k++) gr.addColorStop(k / 4, K.css(P.palette, k / 4 * 0.9 + 0.08 * L, 0.32));
    ctx.fillStyle = gr; ctx.beginPath(); K.smooth(ctx, top); ctx.lineTo(bot[n - 1][0], bot[n - 1][1]); K.smooth(ctx, bot.slice().reverse(), false); ctx.closePath(); ctx.fill();
    if (L === 0) { const sg = ctx.createLinearGradient(0, 0, W, 0); for (let k = 0; k <= 4; k++) sg.addColorStop(k / 4, K.css(P.palette, k / 4, 0.9));
      ctx.strokeStyle = sg; ctx.lineWidth = 2.5; ctx.beginPath(); K.smooth(ctx, top); ctx.stroke(); ctx.beginPath(); K.smooth(ctx, bot); ctx.stroke(); }
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(70, cy - 1, W - 140, 2);
}
});
</script>
