<!doctype html><meta charset="utf-8"><title>Plaza</title>
<script src="../../core/pack-runtime.js"></script>
<script>
const HX = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)), L = 20, W = 1920, H = 1080, fr = x => x - Math.floor(x), hs = (a, b) => fr(Math.sin(a * 12.9898 + b * 78.233) * 43758.5453);
const fw = s => String(s || '').replace(/[!-~]/g, c => String.fromCharCode(c.charCodeAt(0) + 0xFEE0)).replace(/ /g, '\u3000');
definePack({
  init(ctx, K) { K.palettes.vapor = ['#2a1b6b', '#b967ff', '#ff71ce', '#01cdfe', '#fffb96'].map(HX); },
  draw(ctx, T, A, P, K) {
    const TAU = K.TAU, hz = 640, cx = 960, ph2 = K.phase(T, L, 1) * 2, N = 14;
    const sky = ctx.createLinearGradient(0, 0, 0, hz); sky.addColorStop(0, K.css(P.palette, .78)); sky.addColorStop(1, K.css(P.palette, .5)); ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 5; i++) { const x = (K.drift(T, L, 1 + i % 2, W + 500) + i * 400) % (W + 500) - 250, y = 120 + i * 70; ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(x, y, 160, 30, 0, 0, TAU); ctx.ellipse(x + 80, y - 20, 90, 32, 0, 0, TAU); ctx.fill(); }
    const py = 380 + Math.sin(TAU * 2 * T / L) * 16, R = 190 + A.bass * 14;
    ctx.save(); ctx.beginPath(); ctx.arc(cx, py, R, 0, TAU); ctx.clip(); const pg = ctx.createLinearGradient(0, py - R, 0, py + R); pg.addColorStop(0, K.css(P.palette, .95)); pg.addColorStop(.5, K.css(P.palette, .55)); pg.addColorStop(1, K.css(P.palette, .3)); ctx.fillStyle = pg; ctx.fillRect(cx - R, py - R, 2 * R, 2 * R);
    ctx.fillStyle = 'rgba(42,27,107,.5)'; for (let i = 0; i < 7; i++) ctx.fillRect(cx - R, py - R + 60 + i * 50 + ((K.phase(T, L, 1) * 50) % 50), 2 * R, 3 + i * 1.5); ctx.restore();
    ctx.globalCompositeOperation = 'lighter'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    for (let i = 0; i < 64; i++) { const a = i / 64 * TAU - Math.PI / 2, v = A.spectrum[i]; ctx.strokeStyle = K.css(P.palette, .3 + (i / 64) * .6, .3 + v * .6); ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * (R + 24), py + Math.sin(a) * (R + 24)); ctx.lineTo(cx + Math.cos(a) * (R + 24 + 8 + v * 90), py + Math.sin(a) * (R + 24 + 8 + v * 90)); ctx.stroke(); }
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = K.css(P.palette, .1); ctx.fillRect(0, hz, W, H - hz);
    const proj = z => hz + (H - hz) * Math.pow(Math.max(0, z), 2.2);
    for (let j = -2; j < N; j++) {
      const z0 = (j + ph2) / N, z1 = (j + 1 + ph2) / N, y0 = proj(z0), y1 = proj(z1); if (y1 <= hz) continue;
      const s0 = (y0 - hz) / (H - hz) * 150 + 1, s1 = (y1 - hz) / (H - hz) * 150 + 1, par = ((j % 2) + 2) % 2;
      for (let i = -16; i < 16; i++) { if (((i % 2) + 2) % 2 === par) ctx.fillStyle = K.css(P.palette, .6); else ctx.fillStyle = K.css(P.palette, .4); ctx.beginPath(); ctx.moveTo(cx + i * s0, y0); ctx.lineTo(cx + (i + 1) * s0, y0); ctx.lineTo(cx + (i + 1) * s1, y1); ctx.lineTo(cx + i * s1, y1); ctx.fill(); }
    }
    const hf = ctx.createLinearGradient(0, hz, 0, hz + 160); hf.addColorStop(0, K.css(P.palette, .5, .9)); hf.addColorStop(1, K.css(P.palette, .5, 0)); ctx.fillStyle = hf; ctx.fillRect(0, hz, W, 160);
    const col = (x, top, bot, w) => { const g = ctx.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, '#ffe9f6'); g.addColorStop(.5, '#ffffff'); g.addColorStop(1, '#d9b8e8'); ctx.fillStyle = g; ctx.fillRect(x, top, w, bot - top); ctx.fillRect(x - w * .15, top - 24, w * 1.3, 24); ctx.fillRect(x - w * .15, bot, w * 1.3, 24); ctx.strokeStyle = 'rgba(120,80,170,.3)'; ctx.lineWidth = 2; for (let k = 1; k < 5; k++) { ctx.beginPath(); ctx.moveTo(x + w * k / 5, top); ctx.lineTo(x + w * k / 5, bot); ctx.stroke(); } };
    col(120, 60, 800, 120); col(330, 180, 760, 90); col(1680, 60, 800, 120); col(1500, 180, 760, 90);
    ctx.save(); ctx.translate(cx, 760); ctx.rotate(TAU * T / L); const ts = 90 + A.mid * 40; ctx.strokeStyle = K.css(P.palette, .4, .95); ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, -ts); ctx.lineTo(ts * .87, ts * .5); ctx.lineTo(-ts * .87, ts * .5); ctx.closePath(); ctx.stroke(); ctx.restore();
    K.text(ctx, fw(A.meta.title), cx, 1010, { font: '500 54px system-ui', align: 'center', color: '#fff', maxW: 1500 });
  }
});
</script>
