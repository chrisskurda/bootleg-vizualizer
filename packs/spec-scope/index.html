<!doctype html><meta charset="utf-8"><title>Scope: X-Y Lissajous</title>
<script src="../../core/pack-runtime.js"></script>
<script>
definePack({

draw(ctx, T, A, P, K) {
  const W = 1920, H = 1080, cx = W / 2, cy = H / 2, TAU = K.TAU, sz = P.size * (0.55 + 0.7 * A.level + 0.2 * A.beat), d = P.delay | 0;
  ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = K.css(P.palette, 0.5, 0.12); ctx.lineWidth = 1;
  for (let r = 1; r <= 4; r++) { ctx.beginPath(); ctx.arc(cx, cy, r * 120, 0, TAU); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(cx - 520, cy); ctx.lineTo(cx + 520, cy); ctx.moveTo(cx, cy - 520); ctx.lineTo(cx, cy + 520); ctx.stroke();
  let w = Array.from(A.wave); // circular box-blur x2 (radius P.smooth) tames full-mix noise into a readable orbit
  for (let pass = 0; pass < 2; pass++) { const o = w.slice(); for (let j = 0; j < 128; j++) { let m = 0; for (let k = -P.smooth; k <= P.smooth; k++) m += o[(j + k + 128) % 128]; w[j] = m / (2 * P.smooth + 1); } }
  const gain = 1 / Math.max(0.25, ...w.map(Math.abs)), pts = []; for (let j = 0; j < 128; j++) pts.push([cx + w[j] * gain * sz * 0.9, cy + w[(j + d) % 128] * gain * sz * 0.9]); pts.push(pts[0], pts[1]);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.globalCompositeOperation = 'lighter';
  for (const [w, a] of [[16, 0.07], [8, 0.16], [3, 0.95]]) { ctx.strokeStyle = K.css(P.palette, 0.35 + 0.65 * A.level, a); ctx.lineWidth = w; ctx.beginPath(); K.smooth(ctx, pts); ctx.stroke(); }
}
});
</script>
