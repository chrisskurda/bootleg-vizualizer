<!doctype html><meta charset="utf-8"><title>Leaves</title>
<script src="../../core/pack-runtime.js"></script>
<script>
let L, S;
const avg = (a, i, j) => { let s = 0; for (let k = i; k < j; k++) s += a[k]; return s / (j - i); };
definePack({
  init(ctx, K) {
    const r = K.rng(33);
    L = Array.from({ length: 140 }, () => { const z = .3 + r() * .7; return { x: r(), y: r(), z, cy: z > .65 ? 2 : 1, sw: 2 + (r() * 4 | 0), sa: 30 + r() * 70, sp: (r() < .5 ? -1 : 1) * (1 + (r() * 3 | 0)), ph: r() * 6.28, u: r(), sz: 16 + r() * 26 }; });
    S = Array.from({ length: 14 }, () => ({ y: r() * 1080, ph: r() * 6.28, len: 220 + r() * 300 }));
  },
  draw(ctx, T, A, P, K) {
    const W = 1920, H = 1080, TAU = K.TAU, u = T / 24;
    let g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, K.css(P.palette, .1, 1)); g.addColorStop(.7, K.css(P.palette, .45, .55)); g.addColorStop(1, K.css(P.palette, .2, .9));
    ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = P.bg; ctx.globalAlpha = .55; ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 20) ctx.lineTo(x, 900 + 40 * Math.sin(x / W * TAU) + 25 * Math.sin(x / W * TAU * 3 + 1)); ctx.lineTo(W, H); ctx.fill(); ctx.globalAlpha = 1;
    const gust = (A.level + avg(A.past(.4), 0, 64) * 1.5 + avg(A.past(.8), 0, 64) * 1.5) / 3 * P.wind;
    ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (const s of S) {
      const x = ((K.drift(T, 24, 1, W + 600) + s.ph * 300) % (W + 600)) - 300, a = Math.min(1, gust * 2) * .35;
      ctx.strokeStyle = K.css(P.palette, .9, a); ctx.beginPath(); ctx.moveTo(x, s.y); ctx.bezierCurveTo(x + s.len * .3, s.y - 30, x + s.len * .6, s.y + 30, x + s.len, s.y + Math.sin(u * TAU * 2 + s.ph) * 20); ctx.stroke();
    }
    for (let i = 0; i < P.count; i++) {
      const l = L[i], z = l.z;
      const x = ((l.x * (W + 300) + K.drift(T, 24, l.cy, W + 300)) % (W + 300)) - 150 + gust * 220 * z + Math.sin(u * TAU * l.sw + l.ph) * l.sa * z;
      const y = ((l.y * (H + 300) + K.drift(T, 24, l.cy, H + 300)) % (H + 300)) - 150 - A.bass * 40 * z + Math.cos(u * TAU * l.sw * 2 + l.ph) * 14 * z;
      const sp = u * TAU * l.sp + l.ph + gust * .8 * z, sz = l.sz * (.5 + z), sx = Math.cos(sp * 2);
      ctx.save(); ctx.translate(x, y); ctx.rotate(sp * .5 + Math.sin(u * TAU * l.sw + l.ph) * .6); ctx.scale(.35 + .65 * Math.abs(sx), 1); ctx.scale(sz, sz * 1.3);
      ctx.fillStyle = K.css(P.palette, .3 + l.u * .65, .55 + z * .45);
      ctx.beginPath(); ctx.moveTo(0, -1); ctx.bezierCurveTo(.75, -.5, .75, .5, 0, 1); ctx.bezierCurveTo(-.75, .5, -.75, -.5, 0, -1); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = .06; ctx.beginPath(); ctx.moveTo(0, -1); ctx.lineTo(0, 1.25); ctx.stroke();
      ctx.restore();
    }
    K.text(ctx, A.meta.title, 90, 100, { font: '500 34px system-ui', alpha: .8, maxW: 800 });
  }
});
</script>
