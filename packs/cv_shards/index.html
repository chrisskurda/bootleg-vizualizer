<!doctype html><meta charset="utf-8"><title>Cover Shards</title>
<script src="../../core/pack-runtime.js"></script>
<script>
let TR,TG;
definePack({
  bg:'#06070a',
  init(ctx,K){TG=0;},
  draw(ctx,T,A,P,K){
    const W=1920,H=1080,TAU=K.TAU,cov=K.coverArt(A);ctx.fillStyle='#06070a';ctx.fillRect(0,0,W,H);if(!cov){K.text(ctx,'No cover',960,540,{align:'center',font:'500 32px system-ui',alpha:.5});return}
    const N=+P.grid;
    if(TG!==N){TG=N;const r=K.rng(5);TR=[];for(let j=0;j<N;j++)for(let i=0;i<N;i++){const a=[i/N,j/N],b=[(i+1)/N,j/N],c=[(i+1)/N,(j+1)/N],d=[i/N,(j+1)/N];(r()<.5?[[a,b,c],[a,c,d]]:[[a,b,d],[b,c,d]]).forEach(p=>{const cx=(p[0][0]+p[1][0]+p[2][0])/3,cy=(p[0][1]+p[1][1]+p[2][1])/3,dx=cx-.5,dy=cy-.5,L=Math.hypot(dx,dy)||1;TR.push({p,cx,cy,ux:dx/L,uy:dy/L,a:(r()-.5)*2,ph:r()*6.28,b:Math.min(63,Math.floor(L*1.41*40+r()*6))});});}}
    K.coverBlur(ctx,cov,0,0,W,H,24);ctx.fillStyle='rgba(4,5,8,.82)';ctx.fillRect(0,0,W,H);
    const S=900,ox=(W-S)/2,oy=(H-S)/2,ph=K.phase(T,24,2)*TAU;
    for(const t of TR){
      const ex=Math.min(1,A.spectrum[t.b]*1.4)*P.spread+.1*(.5+.5*Math.sin(ph+t.ph))*P.spread,off=ex*90,sc=1+ex*.08;
      ctx.save();ctx.translate(ox+t.cx*S+t.ux*off,oy+t.cy*S+t.uy*off);ctx.rotate(t.a*ex*.4);ctx.scale(sc,sc);ctx.translate(-t.cx*S,-t.cy*S);
      ctx.beginPath();t.p.forEach((q,i)=>i?ctx.lineTo(q[0]*S,q[1]*S):ctx.moveTo(q[0]*S,q[1]*S));ctx.closePath();
      ctx.save();ctx.translate(10,16);ctx.fillStyle='rgba(0,0,0,'+ex*.45+')';ctx.fill();ctx.restore();
      ctx.save();ctx.clip();K.coverDraw(ctx,cov,0,0,1,1,0,0,S,S);ctx.restore();
      if(P.edge&&ex>.08){ctx.strokeStyle=K.rgba(cov.colors[1],Math.min(.8,ex*.9));ctx.lineWidth=2;ctx.stroke();}
      ctx.restore();
    }
  }
});
</script>
