<!doctype html><meta charset="utf-8"><title>Splash</title>
<script src="../../core/pack-runtime.js"></script>
<script>
const hash = n => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };
const low = a => { let s = 0; for (let k = 0; k < 8; k++) s += a[k]; return s / 8; };
definePack({
  draw(ctx, T, A, P, K) {
    const W = 1920, H = 1080, TAU = K.TAU, SY = 640, ph = T / 12 * TAU, STEP = .05, N = 30, G = 1800;
    let g = ctx.createLinearGradient(0, 0, 0, SY); g.addColorStop(0, K.css(P.palette, .05, 1)); g.addColorStop(1, K.css(P.palette, .45, .6));
    ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H); ctx.fillStyle = g; ctx.fillRect(0, 0, W, SY);
    // onset events from the past, on an absolute time grid so they stay put
    const t0 = Math.floor(A.t / STEP) * STEP, lv = [], ev = [];
    for (let j = 0; j <= N + 1; j++) { const age = A.t - (t0 - j * STEP); lv.push(low(A.past(age))); }
    for (let j = 1; j < N; j++) { const o = lv[j - 1] - lv[j], p = lv[j] - lv[j + 1], n = lv[j - 2 < 0 ? 0 : j - 2] - lv[j - 1]; }
    const on = []; for (let j = 0; j < N; j++) on.push(Math.max(0, lv[j] - lv[j + 1]));
    for (let j = 1; j < N - 1; j++) if (on[j] > .12 && on[j] > on[j - 1] && on[j] >= on[j + 1]) { const id = Math.round((t0 - j * STEP) / STEP); ev.push({ id, age: A.t - (t0 - j * STEP), s: Math.min(1, on[j] * 2.5), x: 260 + hash(id) * 1400 }); }
    const surf = x => { let y = SY + Math.sin(x / W * TAU * 3 + ph * 1) * (8 + A.level * 16) + Math.sin(x / W * TAU * 7 - ph * 2) * (4 + A.mid * 10) + Math.sin(x / W * TAU * 13 + ph * 3) * (2 + A.high * 5);
      for (const e of ev) { const d = (x - e.x), r = e.age * 420; y -= e.s * 40 * Math.exp(-e.age * 2.2) * Math.cos(d / 36 - e.age * 14) * Math.exp(-(Math.abs(d) - r) * (Math.abs(d) - r) / 22000) ; } return y; };
    ctx.beginPath(); ctx.moveTo(0, H); const top = []; for (let x = 0; x <= W; x += 16) { const y = surf(x); top.push([x, y]); ctx.lineTo(x, y); } ctx.lineTo(W, H); ctx.closePath();
    let w = ctx.createLinearGradient(0, SY - 20, 0, H); w.addColorStop(0, K.css(P.palette, .55, .95)); w.addColorStop(.35, K.css(P.palette, .25, .95)); w.addColorStop(1, K.css(P.palette, 0, 1));
    ctx.fillStyle = w; ctx.fill();
    ctx.save(); ctx.clip(); ctx.globalCompositeOperation = 'lighter'; ctx.lineWidth = 3;
    for (let i = 0; i < 12; i++) { ctx.strokeStyle = K.css(P.palette, .9, .06 + A.level * .06); ctx.beginPath(); for (let x = 0; x <= W; x += 24) { const y = SY + 60 + i * 34 + Math.sin(x / 140 + ph * 2 + i) * 18 + Math.sin(x / 60 - ph * 3 + i * 2) * 8; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); }
    ctx.restore();
    ctx.strokeStyle = K.css(P.palette, 1, .9); ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.beginPath(); top.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
    ctx.globalCompositeOperation = 'lighter';
    for (const e of ev) {
      for (let i = 0; i < P.drops; i++) {
        const a = -Math.PI / 2 + (hash(e.id * 13 + i) - .5) * 1.5, v = (500 + hash(e.id * 7 + i * 3) * 600) * (.5 + e.s * .6);
        const x = e.x + Math.cos(a) * v * e.age, y = SY + Math.sin(a) * v * e.age + .5 * G * e.age * e.age;
        if (y > SY + 6) continue;
        const r = 3 + hash(e.id + i) * 6;
        ctx.fillStyle = K.css(P.palette, .85, .9); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
        ctx.strokeStyle = K.css(P.palette, .85, .25); ctx.lineWidth = r * .7; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - Math.cos(a) * v * .03, y - (Math.sin(a) * v + G * e.age) * .03); ctx.stroke();
      }
      ctx.strokeStyle = K.css(P.palette, .9, Math.max(0, .5 - e.age)); ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(e.x, SY, 30 + e.age * 520, 6 + e.age * 60, 0, 0, TAU); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
    K.text(ctx, A.meta.title, 90, 100, { font: '500 34px system-ui', alpha: .8, maxW: 800 });
  }
});
</script>
