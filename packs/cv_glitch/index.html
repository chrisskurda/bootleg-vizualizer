<!doctype html><meta charset="utf-8"><title>Cover Glitch</title>
<script src="../../core/pack-runtime.js"></script>
<script>
const hh=n=>{const x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x)};
function chans(cov,K){if(cov._g)return cov._g;const S=720;return cov._g=[[255,0,0],[0,255,0],[0,0,255]].map(c=>{const o=document.createElement('canvas');o.width=o.height=S;const q=o.getContext('2d');K.coverDraw(q,cov,0,0,1,1,0,0,S,S);q.globalCompositeOperation='multiply';q.fillStyle='rgb('+c+')';q.fillRect(0,0,S,S);return o;});}
definePack({
  bg:'#030305',
  draw(ctx,T,A,P,K){
    const W=1920,H=1080,TAU=K.TAU,cov=K.coverArt(A);ctx.fillStyle='#030305';ctx.fillRect(0,0,W,H);if(!cov){K.text(ctx,'No cover',960,540,{align:'center',font:'500 32px system-ui',alpha:.5});return}
    const ch=chans(cov,K),x0=510,y0=90,step=Math.floor(T*10),sp=(A.beat*24+3)*P.split,am=(A.beat*.9+.1)*P.glitch*80;
    ctx.globalCompositeOperation='lighter';
    for(let b=0;b<30;b++){
      const sh=hh(b*3.7+step)>.78?(hh(b+step*5)-.5)*2*am:0;
      for(let c=0;c<3;c++)ctx.drawImage(ch[c],0,b*24,720,24,x0+sh+(c-1)*sp,y0+b*30,900,30.6);
    }
    ctx.globalCompositeOperation='source-over';
    if(P.lines){ctx.fillStyle='rgba(0,0,0,.26)';for(let y=0;y<900;y+=4)ctx.fillRect(x0-40,y0+y,980,1.6);}
    const ty=y0+((K.phase(T,24,3)*1100)%1100)-100;ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(x0,Math.max(y0,ty),900,Math.max(0,Math.min(40,y0+900-ty)));
    for(let i=0;i<3;i++){const s=Math.floor(T*6)+i*9;if(hh(s)>.6){ctx.fillStyle=K.rgba(cov.colors[i],.18);ctx.fillRect(0,hh(s+1)*H,W,3+hh(s+2)*10);}}
    K.text(ctx,((A.meta||{}).title||'').toUpperCase(),x0,y0+960,{font:'500 26px ui-monospace,monospace',alpha:.65,maxW:900});
  }
});
</script>
