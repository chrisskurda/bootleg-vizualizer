<!doctype html><meta charset="utf-8"><title>Neon City</title>
<script src="../../core/pack-runtime.js"></script>
<script>
const HX = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)), L = 20, W = 1920, H = 1080, fr = x => x - Math.floor(x), hs = (a, b) => fr(Math.sin(a * 12.9898 + b * 78.233) * 43758.5453);
let BF, BB, ST, RN;
definePack({
  init(ctx, K) { const r = K.rng(9); BF = Array.from({ length: 32 }, () => ({ h: 120 + r() * 220, s: r() * 9 })); BB = Array.from({ length: 24 }, () => ({ h: 160 + r() * 260, w: .7 + r() * .6 })); ST = Array.from({ length: 80 }, () => [r() * W, r() * 420, r() * 6.28]); RN = Array.from({ length: 110 }, () => ({ x: r() * W, y: r() * H, l: 24 + r() * 40, k: 1 + (r() * 2 | 0) })); },
  draw(ctx, T, A, P, K) {
    const TAU = K.TAU, gy = 900;
    const sky = ctx.createLinearGradient(0, 0, 0, gy); sky.addColorStop(0, P.bg); sky.addColorStop(.7, K.css(P.palette, .55, .8)); sky.addColorStop(1, K.css(P.palette, .85));
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    for (const s of ST) { ctx.fillStyle = 'rgba(255,255,255,' + (.15 + .5 * (.5 + .5 * Math.sin(TAU * 3 * T / L + s[2]))) + ')'; ctx.fillRect(s[0], s[1], 2, 2); }
    const mr = 130 + A.beat * 8, mg = ctx.createLinearGradient(0, 200 - mr, 0, 200 + mr); mg.addColorStop(0, K.css(P.palette, .1)); mg.addColorStop(1, K.css(P.palette, .95));
    ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(1380, 250, mr, 0, TAU); ctx.fill();
    let x = -20; ctx.fillStyle = K.css(P.palette, .45, .55);
    for (const b of BB) { const w = 110 * b.w; ctx.fillRect(x, gy - b.h - 20, w - 6, b.h + 20); x += w; }
    const bw = W / 32;
    for (let i = 0; i < 32; i++) {
      const b = BF[i], hgt = b.h + A.spectrum[Math.min(63, i * 2)] * 260, x = i * bw, y = gy - hgt;
      ctx.fillStyle = '#07040f'; ctx.fillRect(x, y, bw - 4, hgt);
      ctx.fillStyle = K.css(P.palette, (i % 8) / 8, .95); ctx.fillRect(x, y, bw - 4, 5);
      const rows = Math.floor(hgt / 22), cols = 4;
      for (let rr = 1; rr < rows; rr++) for (let c = 0; c < cols; c++) {
        const hv = hs(i * 7 + c, rr), on = hv > .5 && Math.sin(TAU * (2 + (hv * 3 | 0)) * T / L + hv * 40) > -.5; if (!on) continue;
        ctx.fillStyle = K.css(P.palette, hv, .35 + .5 * (hv - .5) * 2); ctx.fillRect(x + 8 + c * 13, y + 10 + rr * 22, 8, 12);
      }
    }
    const rg = ctx.createLinearGradient(0, gy, 0, H); rg.addColorStop(0, K.css(P.palette, .7, .55)); rg.addColorStop(1, P.bg); ctx.fillStyle = rg; ctx.fillRect(0, gy, W, H - gy);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 32; i++) { const v = A.spectrum[Math.min(63, i * 2)]; ctx.fillStyle = K.css(P.palette, (i % 8) / 8, .08 + v * .3); ctx.fillRect(i * bw, gy + 6, bw - 4, 20 + v * 120); }
    ctx.lineCap = 'round'; ctx.lineWidth = 2;
    for (const d of RN) { const y = (K.drift(T, L, 5 * d.k, H + 120) + d.y) % (H + 120) - 60, xx = d.x - y * .2; ctx.strokeStyle = 'rgba(190,210,255,.28)'; ctx.beginPath(); ctx.moveTo(xx, y); ctx.lineTo(xx - d.l * .2, y + d.l); ctx.stroke(); }
    ctx.globalCompositeOperation = 'source-over';
    const f = 0.7 + 0.3 * Math.sin(TAU * 7 * T / L) ** 2;
    K.text(ctx, A.meta.title, 90, 110, { font: '700 54px system-ui', color: K.css(P.palette, .95), upper: true, maxW: 900, alpha: .5 + .5 * f });
    K.text(ctx, A.meta.artist, 90, 150, { font: '400 28px system-ui', alpha: .75, maxW: 700 });
  }
});
</script>
