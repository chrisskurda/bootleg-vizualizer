<!doctype html><meta charset="utf-8"><title>Cover Strips</title>
<script src="../../core/pack-runtime.js"></script>
<script>
definePack({
  bg:'#06070a',
  draw(ctx,T,A,P,K){
    const W=1920,H=1080,TAU=K.TAU,cov=K.coverArt(A);ctx.fillStyle='#06070a';ctx.fillRect(0,0,W,H);if(!cov){K.text(ctx,'No cover',960,540,{align:'center',font:'500 32px system-ui',alpha:.5});return}
    K.coverBlur(ctx,cov,0,0,W,H,24);ctx.fillStyle='rgba(4,5,8,.8)';ctx.fillRect(0,0,W,H);
    const n=+P.count,S=900,x0=(W-S)/2,y0=(H-S)/2,w=S/n,ph=K.phase(T,24,2)*TAU,col=P.mode==='columns';
    for(let i=0;i<n;i++){
      const u=i/n,m=Math.abs(u-.5)*2,bin=Math.floor(m*40),v=Math.min(1,A.spectrum[bin]*1.3),sg=i%2?-1:1;
      const off=(Math.sin(ph+u*TAU*3)*10+sg*v*90*P.amp)*(1-.35*m),sc=1+v*.05*P.amp;
      if(col){const dh=S*sc;K.coverDraw(ctx,cov,u,0,1/n,1,x0+i*w,y0+off-(dh-S)/2,w+.6,dh);}
      else{const dw=S*sc;K.coverDraw(ctx,cov,0,u,1,1/n,x0+off-(dw-S)/2,y0+i*w,dw,w+.6);}
    }
    ctx.globalCompositeOperation='lighter';ctx.strokeStyle=K.rgba(cov.colors[0],.25+A.beat*.4);ctx.lineWidth=2;ctx.strokeRect(x0-20,y0-20,S+40,S+40);ctx.globalCompositeOperation='source-over';
    K.text(ctx,(A.meta||{}).title,x0,y0+S+60,{font:'500 28px system-ui',alpha:.7,maxW:S});
  }
});
</script>
